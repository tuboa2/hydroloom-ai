[project]
name = "hydromind"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "catboost>=1.2.10",
    "faker>=40.22.0",
    "lightgbm>=4.7.0",
    "matplotlib>=3.11.0",
    "mlflow>=3.14.0",
    "numba>=0.66.0",
    "numpy>=2.4.6",
    "optuna>=4.9.0",
    "orjson>=3.11.9",
    "pandas>=2.2.0,<3.0.0",
    "polars>=1.41.2",
    "psutil>=7.2.2",
    "pyarrow>=24.0.0",
    "pytest>=9.1.1",
    "scikit-learn>=1.9.0",
    "scipy>=1.17.1",
    "seaborn>=0.13.2",
    "shap>=0.49.1",
    "tl2cgen>=1.0.0",
    "uuid-utils>=0.16.2",
    "wandb>=0.28.1",
    "xgboost>=3.4.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["services*"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP"] # Errors, Pyflakes, Import sorting, Naming, Pyupgrade
ignore = ["E501"]                  # Defer long line handling to the formatter

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["test_*.py", "*_test.py", "*.py"]
